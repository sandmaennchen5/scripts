[emby]
url = http://127.0.0.1:8096
api_key = HIER_EMBY_API_KEY_EINTRAGEN
user_id =
verify_tls = true
timeout = 45
page_size = 500

[checks]
minimum_height = 720
german_language_aliases = de,deu,ger,deutsch,german
check_german_subtitles = true
report_unknown_audio_language = true
report_unknown_resolution = true

; strict = nur melden, wenn praktisch alle Kerndaten fehlen
; any = melden, sobald mindestens ein geprüftes Metadatenfeld fehlt
metadata_mode = strict

[report]
; HTML language: de or en
language = en
directory = reports
keep_reports = 20
save_json = true

[history]
database = emby_health.sqlite3

[mail]
; Synology MailPlus lokal
smtp_host = 127.0.0.1
smtp_port = 25
smtp_user =
smtp_password =
starttls = false
ssl = false

from = emby@deinedomain.de
to = deinpostfach@deinedomain.de
subject_prefix = [Emby Health]
attach_html = true

[logging]
level = INFO
file = emby_health.log
